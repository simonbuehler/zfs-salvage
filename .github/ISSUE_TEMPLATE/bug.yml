name: Bug
description: Something does not work as the README says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Commands or clicks, in order. Logs are in `data/logs/` next to the launcher.
  - type: input
    id: version
    attributes:
      label: zfs-salvage version and system
      description: "`./zfs-salvage version`, and the live system you run it on (e.g. Ubuntu 24.04 live)"
    validations:
      required: true
