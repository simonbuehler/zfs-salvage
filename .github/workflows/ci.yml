# Tests on every push and pull request. The fixture pools (about 30 MB) are not in git: they are the asset fixtures.tar of
# the release FIXTURES_RELEASE of this repository (made with tests/pack-fixtures.sh). `gh release download` with the
# workflow's token works for private repositories too.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FIXTURES_RELEASE: fixtures-1

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build the portable binaries and check them
        run: tools/build-portable.sh

      - name: Fetch the fixture pools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$FIXTURES_RELEASE" --repo "${{ github.repository }}" --pattern fixtures.tar --dir "$RUNNER_TEMP"
          tests/fetch-fixtures.sh "$RUNNER_TEMP/fixtures.tar"

      - name: Unit and integration tests
        run: python3 -W error::ResourceWarning -m unittest discover -s tests

      - name: Pipeline on every fixture pool (and the capability matrix)
        run: tests/run.sh --matrix

      - name: The capability matrix is up to date
        run: |
          git diff --exit-code tests/capabilities.json
          scripts/gen-matrix.py --check

      - name: End to end through the web API
        run: tests/e2e-local.sh
