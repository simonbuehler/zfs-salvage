# Tests on every push and pull request. The fixture pools (about 30 MB) are not in git: they are the asset fixtures.tar of
# the release named in tests/fixtures/RELEASE (made with `make fixtures-pack`). `make fixtures` uses gh with the
# workflow's token when the plain download fails, so this works for a private repository too.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build the portable binaries and check them
        run: make portable

      - name: Fetch the fixture pools
        env:
          GH_TOKEN: ${{ github.token }}
        run: make fixtures GITHUB_REPO="${{ github.repository }}"

      - name: Unit and integration tests
        run: make test

      - name: Pipeline on every fixture pool (and the capability matrix)
        run: tests/run.sh --matrix

      - name: The capability matrix is up to date
        run: |
          git diff --exit-code tests/capabilities.json
          dev/gen-matrix.py --check

      - name: End to end through the web API
        run: tests/e2e-local.sh
